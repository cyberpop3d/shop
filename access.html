<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0c">
  <title>Get Collection Access — CyberPop</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-header">
  <a class="brand-lockup" href="/">CYBERPOP</a>
  <button class="menu-toggle" aria-label="Menu">☰</button>
  <nav class="site-nav">
    <a href="/">Collections</a>
    <a href="/request">Custom Design</a>
    <a href="/library">Library</a>
    <a class="account-chip" href="/account"><span data-account-label>Account</span></a>
  </nav>
</header>
<main class="site-shell access-shell">
  <section class="access-head">
    <span class="eyebrow">CYBERPOP COLLECTIONS</span>
    <h1>Get Collection Access</h1>
  </section>

  <section id="accessAuth" class="access-card" hidden>
    <span class="eyebrow">ACCOUNT REQUIRED</span>
    <h2>Sign in first.</h2>
    <a class="btn btn-light" href="/account?returnTo=%2Faccess">Sign in / Create account →</a>
  </section>

  <section id="accessApp" class="access-card" hidden>
    <div class="access-account-line"><span>Requesting as</span><strong id="accessEmail"></strong></div>
    <form id="accessForm">
      <div id="accessPlans" class="access-plan-grid"></div>
      <div class="access-fields">
        <label>Patreon / Founder code <span>Optional</span><input id="accessCoupon" class="field" maxlength="64" autocomplete="off" placeholder="Code"></label>
        <label>Note <span>Optional</span><textarea id="accessNote" class="field access-note" maxlength="1200" placeholder="Anything we should know?"></textarea></label>
      </div>
      <div class="access-submit-row">
        <span id="accessStatus" class="small"></span>
        <button id="accessSubmit" class="btn btn-light" type="submit">Send Access Request →</button>
      </div>
      <p class="access-manual-note">No charge is made when you send a request. We’ll review it and email your payment request.</p>
    </form>
    <div id="accessSuccess" class="state-card success" hidden></div>
  </section>
</main>
<script type="module" src="/access.js"></script>
</body>
</html>
