name: Cults exact promo cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/cults-cleanup-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CULTS_USERNAME: CyberPOP
      CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
      CULTS_API_KEY_ROTATED: ${{ secrets.CULTS_API_KEY_ROTATED }}
    steps:
      - name: Cleanup exact promo block via Cults GraphQL
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error, re, time, sys

          USERNAME = os.environ.get("CULTS_USERNAME", "CyberPOP")
          KEYS = [os.environ.get("CULTS_API_KEY_ROTATED","").strip(), os.environ.get("CULTS_API_KEY","").strip()]
          KEYS = [k for k in KEYS if k]
          URL = "https://cults3d.com/graphql"
          EXPECTED_MATCHES = 50

          promo = re.compile(
              r'(?:^|\r?\n)[ \t]*!\[GET ALL September DROPS\]\(https://i\.imgur\.com/llN5uPY\.png\)[ \t]*\r?\n'
              r'[ \t]*Patreon:[ \t]*\[link\]\(https://www\.patreon\.com/cw/CyberPop\)[ \t]*(?=\r?\n|$)',
              re.M,
          )

          def gql(key, query, variables=None):
              payload = json.dumps({"query": query, "variables": variables or {}}).encode()
              auth = base64.b64encode(f"{USERNAME}:{key}".encode()).decode()
              req = urllib.request.Request(
                  URL, data=payload, method="POST",
                  headers={
                      "Authorization": "Basic " + auth,
                      "Content-Type": "application/json",
                      "User-Agent": "CyberPop-Exact-Promo-Cleanup/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  try: body = json.loads(e.read().decode())
                  except Exception: body = {"errors":[{"message":f"HTTP {e.code}"}]}
                  return e.code, body

          if not KEYS:
              raise SystemExit("No GitHub Cults API secret configured.")

          probe = """query Probe { myself { creationsBatch(limit: 1, offset: 0) { total results { id name(locale: EN) } } } }"""
          key = None
          for candidate in KEYS:
              status, body = gql(candidate, probe)
              if status == 200 and not body.get("errors") and body.get("data",{}).get("myself",{}).get("creationsBatch") is not None:
                  key = candidate
                  break
          if not key:
              raise SystemExit("Configured GitHub Cults secret(s) did not authenticate.")

          scan_q = """query Scan($limit: Int!, $offset: Int!) {
            myself {
              creationsBatch(limit: $limit, offset: $offset, sort: BY_PUBLICATION) {
                total
                results { id name(locale: EN) description(locale: EN) url(locale: EN) }
              }
            }
          }"""

          def scan():
              rows=[]; offset=0; limit=50; total=0
              while True:
                  status, body = gql(key, scan_q, {"limit":limit,"offset":offset})
                  if status != 200 or body.get("errors"):
                      raise RuntimeError("scan failed")
                  batch = body["data"]["myself"]["creationsBatch"]
                  part = batch.get("results") or []
                  total = int(batch.get("total") or 0)
                  rows.extend(part); offset += len(part)
                  if not part or offset >= total: break
              return rows

          def clean(text):
              out = promo.sub("\n", text or "")
              return re.sub(r"\n{3,}", "\n\n", out)

          rows = scan()
          matches=[]
          for item in rows:
              before = item.get("description") or ""
              after = clean(before)
              if after != before:
                  matches.append((item, after))

          print(f"scanned={len(rows)} matched={len(matches)}")
          if len(matches) != EXPECTED_MATCHES:
              raise SystemExit(f"Safety stop: expected {EXPECTED_MATCHES}, got {len(matches)}")

          mutation = """mutation Update($id: ID!, $description: String!) {
            updateCreation(id: $id, description: $description, locale: EN)
          }"""

          updated=0
          for item, after in matches:
              status, body = gql(key, mutation, {"id":item["id"],"description":after})
              if status != 200 or body.get("errors"):
                  raise RuntimeError("update failed for " + str(item.get("name")) + ": " + json.dumps(body.get("errors") or body))
              updated += 1
              print(f"updated={updated}/{len(matches)} {item.get('name')}")
              time.sleep(0.35)

          remaining=[]
          for item in scan():
              before = item.get("description") or ""
              if clean(before) != before:
                  remaining.append(item.get("name"))

          print(f"verification_remaining={len(remaining)}")
          if remaining:
              raise SystemExit("Verification failed.")
          print("CLEANUP_COMPLETE")
          PY
