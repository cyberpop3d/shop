name: One-time Cults September promo cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cults-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CULTS_USERNAME: CyberPOP
      CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
      CULTS_API_KEY_ROTATED: ${{ secrets.CULTS_API_KEY_ROTATED }}
    steps:
      - name: Remove exact September promo block
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error, re, time, sys

          USERNAME = os.environ.get("CULTS_USERNAME", "CyberPOP")
          KEYS = [os.environ.get("CULTS_API_KEY_ROTATED","").strip(), os.environ.get("CULTS_API_KEY","").strip()]
          KEYS = [k for k in KEYS if k]
          URL = "https://cults3d.com/graphql"
          EXPECTED_MATCHES = 50

          promo = re.compile(
              r'(?:^|\\r?\\n)[ \\t]*!\\[GET ALL September DROPS\\]\\(https://i\\.imgur\\.com/llN5uPY\\.png\\)[ \\t]*\\r?\\n'
              r'[ \\t]*Patreon:[ \\t]*\\[link\\]\\(https://www\\.patreon\\.com/cw/CyberPop\\)[ \\t]*(?=\\r?\\n|$)',
              re.M,
          )

          def gql(key, query, variables=None):
              payload = json.dumps({"query": query, "variables": variables or {}}).encode()
              auth = base64.b64encode(f"{USERNAME}:{key}".encode()).decode()
              req = urllib.request.Request(
                  URL,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": "Basic " + auth,
                      "Content-Type": "application/json",
                      "User-Agent": "CyberPop-Exact-Promo-Cleanup/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = json.loads(resp.read().decode())
                      return resp.status, body
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read().decode())
                  except Exception:
                      body = {"errors": [{"message": f"HTTP {e.code}"}]}
                  return e.code, body

          probe = """query Probe {
            myself {
              creationsBatch(limit: 1, offset: 0) {
                total
                results { id name(locale: EN) }
              }
            }
          }"""

          key = None
          slot = None
          for idx, candidate in enumerate(KEYS, 1):
              status, body = gql(candidate, probe)
              if status == 200 and not body.get("errors") and body.get("data",{}).get("myself",{}).get("creationsBatch") is not None:
                  key = candidate
                  slot = idx
                  break

          if not key:
              raise SystemExit("No configured CULTS_API_KEY/CULTS_API_KEY_ROTATED secret authenticated.")
          print(f"Authenticated as {USERNAME} using configured secret slot {slot}.")

          scan_query = """query Scan($limit: Int!, $offset: Int!) {
            myself {
              creationsBatch(limit: $limit, offset: $offset, sort: BY_PUBLICATION) {
                total
                results {
                  id
                  name(locale: EN)
                  description(locale: EN)
                  url(locale: EN)
                }
              }
            }
          }"""

          def scan():
              rows = []
              offset = 0
              limit = 50
              total = 0
              while True:
                  status, body = gql(key, scan_query, {"limit": limit, "offset": offset})
                  if status != 200 or body.get("errors"):
                      raise RuntimeError("Scan failed: " + json.dumps(body.get("errors") or body))
                  batch = body["data"]["myself"]["creationsBatch"]
                  part = batch.get("results") or []
                  total = int(batch.get("total") or 0)
                  rows.extend(part)
                  offset += len(part)
                  if not part or offset >= total:
                      break
              return total, rows

          def cleaned(text):
              out = promo.sub("\n", text or "")
              out = re.sub(r"\\n{3,}", "\n\n", out)
              return out

          total, rows = scan()
          matches = []
          for item in rows:
              before = item.get("description") or ""
              after = cleaned(before)
              if after != before:
                  matches.append((item, after))

          print(f"Scanned {len(rows)} of {total} designs. Exact matches: {len(matches)}.")
          for item, _ in matches:
              print("MATCH:", item.get("name"))

          if len(matches) != EXPECTED_MATCHES:
              raise SystemExit(f"Safety stop: expected {EXPECTED_MATCHES} exact matches, got {len(matches)}.")

          mutation = """mutation Update($id: ID!, $description: String!) {
            updateCreation(id: $id, description: $description, locale: EN)
          }"""

          updated = 0
          for item, after in matches:
              status, body = gql(key, mutation, {"id": item["id"], "description": after})
              if status != 200 or body.get("errors"):
                  raise RuntimeError(
                      "Update failed for " + str(item.get("name")) + ": " + json.dumps(body.get("errors") or body)
                  )
              updated += 1
              print(f"UPDATED {updated}/{len(matches)}:", item.get("name"))
              time.sleep(0.35)

          _, verify_rows = scan()
          remaining = []
          for item in verify_rows:
              if cleaned(item.get("description") or "") != (item.get("description") or ""):
                  remaining.append(item.get("name"))

          print(f"Verification: updated={updated}, remaining_exact_matches={len(remaining)}")
          if remaining:
              print("REMAINING:", remaining)
              raise SystemExit("Verification failed: exact promo block still exists.")
          print("CLEANUP_COMPLETE")
          PY
